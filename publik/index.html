<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nikoh Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0d14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .neon-btn { background: linear-gradient(135deg, #8b5cf6 0%, #4f46e5 100%); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
    .neon-text { color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }
    .gold-card { background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(180, 83, 9, 0.1) 100%); border: 1px solid rgba(245, 158, 11, 0.3); }
    .blur-photo { filter: blur(10px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('katalog');
      const [users, setUsers] = useState([]);
      const [notifications, setNotifications] = useState(true);
      const [pauseProfile, setPauseProfile] = useState(false);

      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }

        fetch('/api/users')
          .then(res => res.json())
          .then(data => setUsers(data))
          .catch(() => {});
      }, []);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 p-4">
          
          {/* HEADER */}
          <header className="flex justify-between items-center mb-4">
            <div className="flex items-center gap-2">
              <span className="text-2xl">💜</span>
              <h1 className="text-xl font-bold neon-text">Taskin</h1>
            </div>
            <div className="glass-card px-3 py-1 rounded-full text-[10px] text-purple-300 border border-purple-500/30 flex items-center gap-1">
              <span>🛡️</span> AI yuz tasdiqlash
            </div>
          </header>

          {/* TAB 1: KATALOG */}
          {tab === 'katalog' && (
            <div className="space-y-4">
              {/* Filtr va Tugmalar */}
              <div className="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button className="glass-card px-3 py-1.5 rounded-xl flex items-center gap-1 text-amber-300">🎁 1 bepul yozish</button>
                <button className="glass-card px-3 py-1.5 rounded-xl">⚙️ Filtr (1)</button>
                <button className="glass-card px-3 py-1.5 rounded-xl">⇕ Eng mos</button>
              </div>

              {/* VIP Nomzodlar */}
              <div className="gold-card p-3 rounded-2xl">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-amber-400 flex items-center gap-1">👑 VIP nomzodlar</span>
                  <span className="text-[10px] text-amber-300">Hammasi &gt;</span>
                </div>
                <div className="flex gap-3 overflow-x-auto">
                  {users.filter(u => u.isVip).map(u => (
                    <div key={u.id} className="min-w-[130px] glass-card p-2 rounded-xl text-center relative">
                      <div className="w-full h-20 bg-gray-800 rounded-lg mb-2 relative overflow-hidden flex items-center justify-center">
                        <span className="text-2xl">👤</span>
                        <div className="absolute inset-0 bg-black/50 blur-photo"></div>
                        <span className="absolute text-[10px] bg-black/70 px-2 py-0.5 rounded text-gray-200">🔒 Xira</span>
                      </div>
                      <div className="font-bold text-xs">{u.name}, {u.age}</div>
                      <div className="text-[10px] text-gray-400">{u.city}</div>
                      <div className="text-[10px] text-purple-400 font-bold mt-1">{u.match}% moslik</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Kunlik Tavsiya */}
              <div className="glass-card p-4 rounded-2xl border border-purple-500/30 bg-gradient-to-r from-purple-900/20 to-indigo-900/20">
                <div className="text-[10px] text-purple-300 font-bold mb-1">✨ Kunlik tavsiya</div>
                <div className="flex justify-between items-center">
                  <div>
                    <div className="font-bold text-base">Bonu, 20 ✔️</div>
                    <div className="text-xs text-gray-400">Farg'ona viloyati • Uy beka</div>
                  </div>
                  <div className="w-12 h-12 rounded-full border border-purple-400 flex items-center justify-center font-bold text-purple-300 bg-purple-600/20">
                    100%
                  </div>
                </div>
              </div>

              {/* Asosiy Nomzodlar Ro'yxati */}
              <div className="space-y-2">
                {users.map(u => (
                  <div key={u.id} className="glass-card p-3 rounded-2xl flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-full bg-gray-800 relative overflow-hidden flex items-center justify-center">
                        <span className="text-xl">👤</span>
                        <div className="absolute inset-0 bg-black/40 blur-photo"></div>
                      </div>
                      <div>
                        <div className="font-bold text-sm flex items-center gap-1">
                          {u.name}, {u.age} ✔️ 
                          {u.isPremium && <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">💎 Premium</span>}
                        </div>
                        <div className="text-xs text-gray-400">{u.city} {u.status ? `• ${u.status}` : ''}</div>
                        <div className="text-xs text-purple-400 font-semibold">{u.match}% moslik</div>
                      </div>
                    </div>
                    <button className="p-2 glass-card rounded-xl text-gray-400 hover:text-purple-400">🔖</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 2: XABARLAR */}
          {tab === 'xabarlar' && (
            <div className="space-y-3">
              <input type="text" placeholder="Ism bo'yicha qidirish" className="w-full p-3 glass-card rounded-xl text-xs focus:outline-none border border-purple-500/30" />
              <div className="text-xs font-bold text-gray-400 mt-2">NOFAOL SUHBATLAR (2)</div>
              <div className="space-y-2">
                <div className="glass-card p-3 rounded-xl flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center">👤</div>
                    <div>
                      <div className="font-bold text-sm">Guli, 22 ✔️</div>
                      <div className="text-xs text-gray-400">Siz: Assalomu alaykum</div>
                    </div>
                  </div>
                  <span className="text-[10px] text-gray-500">2 oy</span>
                </div>
                <div className="glass-card p-3 rounded-xl flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center">👤</div>
                    <div>
                      <div className="font-bold text-sm">Malika, 19 ✔️</div>
                      <div className="text-xs text-gray-400">Siz: Profilingizni ko'rib...</div>
                    </div>
                  </div>
                  <span className="text-[10px] text-gray-500">4 oy</span>
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: SAQLANGANLAR */}
          {tab === 'saqlangan' && (
            <div className="glass-card p-4 rounded-2xl text-center space-y-3 border border-purple-500/20">
              <div className="w-full h-56 bg-gray-800 rounded-xl relative overflow-hidden flex items-center justify-center">
                <span className="text-3xl">👤</span>
                <div className="absolute inset-0 bg-black/60 blur-photo"></div>
                <span className="absolute text-xs bg-black/80 px-3 py-1 rounded-full border border-purple-500/40">🔒 Xira Rasm</span>
              </div>
              <div>
                <h3 className="font-bold text-lg flex items-center justify-center gap-1">Salomatxon, 19 ✔️</h3>
                <p className="text-xs text-gray-400">Farg'ona viloyati • Tikuvchi</p>
              </div>
              <div className="text-xs text-red-400 bg-red-500/10 py-2 px-3 rounded-xl border border-red-500/20 space-y-1">
                <div>🔒 Talabiga mos emas:</div>
                <div className="flex justify-center gap-2 font-semibold">
                  <span>✖ Oilaviy holat</span>
                  <span>✖ Ma'lumot</span>
                </div>
              </div>
              <button disabled className="w-full py-3 glass-card rounded-xl text-xs text-gray-500 border border-gray-700">Yoza olmaysiz</button>
            </div>
          )}

          {/* TAB 4: MEN (PROFIL VA SOZLAMALAR) */}
          {tab === 'men' && (
            <div className="space-y-4 text-xs">
              {/* Profil Ma'lumoti */}
              <div className="glass-card p-4 rounded-2xl flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-lg">Xoji, 26</h3>
                  <p className="text-gray-400">Farg'ona viloyati</p>
                  <p className="text-purple-400 font-medium mt-1">Profil to'ldirilgani: 75%</p>
                </div>
                <button className="px-3 py-1.5 glass-card rounded-xl border border-purple-500/30">Tahrirlash</button>
              </div>

              {/* Premium Card */}
              <div className="glass-card p-4 rounded-2xl bg-gradient-to-r from-emerald-900/30 to-teal-900/30 border border-emerald-500/30 space-y-2">
                <div className="font-bold text-sm text-emerald-300">Sizni kim ko'rayotganini biling</div>
                <p className="text-gray-300">Kim ekanini biling va katalogda yuqorida chiqing.</p>
                <button className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white">
                  Premium olish — 129 000 so'm/oy
                </button>
              </div>

              {/* Bo'limlar Ro'yxati */}
              <div className="glass-card rounded-2xl divide-y divide-gray-800">
                <div className="p-3 flex justify-between items-center"><span>👀 Kim sizni ko'rdi</span><span className="text-gray-500">🔒 Hali ko'rilmagan</span></div>
                <div className="p-3 flex justify-between items-center"><span>💚 Kim sizni saqladi</span><span className="text-gray-500">🔒 Hali saqlanmagan</span></div>
                <div className="p-3 flex justify-between items-center"><span>📊 Statistika</span><span className="text-purple-400">Profil tahlili — VIP</span></div>
              </div>

              <div className="glass-card rounded-2xl divide-y divide-gray-800">
                <div className="p-3 flex justify-between items-center"><span>💍 Juftimni topdim</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>🛡️ Xavfsizlik markazi</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center">
                  <span>🙈 Profilni to'xtatish</span>
                  <input type="checkbox" checked={pauseProfile} onChange={() => setPauseProfile(!pauseProfile)} className="toggle" />
                </div>
                <div className="p-3 flex justify-between items-center">
                  <span>🔔 Bildirishnomalar</span>
                  <input type="checkbox" checked={notifications} onChange={() => setNotifications(!notifications)} className="toggle" />
                </div>
              </div>

              <div className="glass-card rounded-2xl divide-y divide-gray-800">
                <div className="p-3 flex justify-between items-center"><span>⚙️ Umumiy sozlamalar</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>🤖 Taskin yordamchisi (AI)</span><span className="text-gray-400">24/7 &gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>💳 Mening kartalarim</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>🧾 To'lovlar tarixi</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>🚫 Bloklanganlar</span><span className="text-gray-400">&gt;</span></div>
                <div className="p-3 flex justify-between items-center"><span>💌 Admin bilan bog'lanish</span><span className="text-gray-400">&gt;</span></div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-purple-500/20 p-2.5 flex justify-around items-center bg-black/90 backdrop-blur-lg">
            <button onClick={() => setTab('katalog')} className={`flex flex-col items-center text-[10px] ${tab === 'katalog' ? 'neon-text font-bold' : 'text-gray-400'}`}>
              <span className="text-base">🔍</span> Katalog
            </button>
            <button onClick={() => setTab('xabarlar')} className={`flex flex-col items-center text-[10px] ${tab === 'xabarlar' ? 'neon-text font-bold' : 'text-gray-400'}`}>
              <span className="text-base">💬</span> Xabarlar
            </button>
            <button onClick={() => setTab('saqlangan')} className={`flex flex-col items-center text-[10px] ${tab === 'saqlangan' ? 'neon-text font-bold' : 'text-gray-400'}`}>
              <span className="text-base">🔖</span> Saqlangan
            </button>
            <button onClick={() => setTab('men')} className={`flex flex-col items-center text-[10px] ${tab === 'men' ? 'neon-text font-bold' : 'text-gray-400'}`}>
              <span className="text-base">👤</span> Men
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
